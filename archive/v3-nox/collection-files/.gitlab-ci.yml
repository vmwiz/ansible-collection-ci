# .gitlab-ci.yml - pipeline de test/validation d'une collection Ansible (airgap, Nexus)
# Toute la logique est dans noxfile.py : ce fichier ne fait qu'orchestrer.
#
# Deux familles de runners (voir infra/gitlab-runner/) :
#   * tag "openshift"       : executor Kubernetes sur OpenShift, pods restreints (UID aleatoire,
#                             non-root, sans moteur de conteneurs) -> jobs SANS conteneurs ;
#   * tag "ansible-builder" : executor shell sur la VM ansible-builder (podman rootless)
#                             -> ansible-test --docker via podman, integration, molecule.
# Alternative historique (runner docker avec socket ou DinD) : voir .docker-socket plus bas.

variables:
  # Image runner construite depuis infra/runner-image/Dockerfile et poussee dans Nexus (docker-hosted)
  CI_RUNNER_IMAGE: "nexus.corp.local:8443/ci/ansible-collection-runner:2026.10"
  # PyPI via Nexus (aussi pose dans /etc/pip.conf de l'image et de la VM ; l'env a priorite pour nox)
  PIP_INDEX_URL: "https://nexus.corp.local/repository/pypi-group/simple"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Miroir Nexus de quay.io (proxy Docker) : re-tag des images ansible-test
  ANSIBLE_TEST_IMAGE_MIRROR: "nexus.corp.local:8444"
  # pip a l'interieur des conteneurs ansible-test (units --requirements, integration...)
  ANSIBLE_TEST_PYPI_ENDPOINT: "https://nexus.corp.local/repository/pypi-group/simple/"
  # Matrice ansible-core (garder en phase avec parallel:matrix ci-dessous)
  ANSIBLE_CORE_VERSIONS: "2.19 2.20 2.21 2.22"
  ANSIBLE_CORE_PRERELEASE: "2.22"  # release candidate au 20/10/2026 : vider a la GA
  ANSIBLE_CORE_DEFAULT: "2.21"
  # Instance Steampunk Spotter PRIVEE ; SPOTTER_TOKEN = variable CI/CD masquee (Settings > CI/CD)
  SPOTTER_ENDPOINT: "https://spotter.corp.local/api"
  SPOTTER_CACERT: "/etc/pki/tls/certs/ca-bundle.crt"
  FORCE_COLOR: "1"
  GIT_DEPTH: "0"

default:
  image: $CI_RUNNER_IMAGE
  tags: [openshift]
  interruptible: true
  cache:
    key: "nox-$CI_JOB_NAME_SLUG"
    paths:
      - .cache/pip
    when: always

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^stable-/
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - lint
  - build
  - security
  - test
  - integration
  - publish

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------
.reports:
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
    reports:
      junit:
        - reports/**/junit/*.xml

# Jobs sur la VM ansible-builder (executor shell, podman rootless) : pas d'image,
# nox est installe sur la VM (/opt/ansible-ci, cf. infra/ansible-builder-vm).
.ansible-builder:
  image: null
  tags: [ansible-builder]
  variables:
    ANSIBLE_TEST_MODE: "docker"
    ANSIBLE_TEST_PREFER_PODMAN: "1"
    CONTAINER_ENGINE: "podman"
  before_script:
    - export PATH="/opt/ansible-ci/bin:$PATH"
    - podman info --format '{{.Host.Security.Rootless}} cgroup={{.Host.CgroupsVersion}}'

# Variante runner docker (socket de l'hote ou service DinD privileged) si ni OpenShift ni VM podman.
.docker-socket:
  tags: [docker]
  variables:
    ANSIBLE_TEST_MODE: "docker"

# ---------------------------------------------------------------------------
# Lint (pod OpenShift)
# ---------------------------------------------------------------------------
lint:
  stage: lint
  script:
    - nox -R -s lint

docs:
  stage: lint
  script:
    - nox -R -s docs
  allow_failure: true

# ---------------------------------------------------------------------------
# Build + validation de l'artefact (pod OpenShift)
# ---------------------------------------------------------------------------
build:
  stage: build
  script:
    - nox -R -s build galaxy-importer
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/*.tar.gz
      - reports/galaxy-importer/

# ---------------------------------------------------------------------------
# Securite (pod OpenShift)
# ---------------------------------------------------------------------------
security-scan:
  stage: security
  needs: []
  script:
    # Bloquant si constat HIGH/CRITICAL ; produit aussi un rapport GitLab SAST
    - nox -R -s security-scan
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/security/
    reports:
      junit:
        - reports/security/*.xml
      sast:
        - reports/security/gl-sast-report.json

spotter:
  stage: security
  needs: []
  # Non bloquant au demarrage (calibrage des regles), a passer en bloquant ensuite
  allow_failure: true
  rules:
    - if: $SPOTTER_TOKEN
  script:
    - nox -R -s spotter
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/spotter/
    reports:
      junit:
        - reports/spotter/*.xml

# ---------------------------------------------------------------------------
# ansible-test sanity / units, rapides : pod OpenShift, --venv (Python de l'image uniquement)
# ---------------------------------------------------------------------------
sanity:
  stage: test
  extends: .reports
  needs: []
  variables:
    ANSIBLE_TEST_MODE: "venv"
  parallel:
    matrix:
      - ANSIBLE_CORE: ["2.19", "2.20", "2.21", "2.22"]
  script:
    - nox -R -s "sanity-${ANSIBLE_CORE}"

units:
  stage: test
  extends: .reports
  needs: []
  variables:
    ANSIBLE_TEST_MODE: "venv"
  parallel:
    matrix:
      - ANSIBLE_CORE: ["2.19", "2.20", "2.21", "2.22"]
  script:
    - nox -R -s "units-${ANSIBLE_CORE}"

# ---------------------------------------------------------------------------
# VM ansible-builder (podman) : pleine fidelite + integration + molecule
# ---------------------------------------------------------------------------
sanity-full:
  stage: integration
  extends: [.reports, .ansible-builder]
  needs: []
  parallel:
    matrix:
      - ANSIBLE_CORE: ["2.19", "2.20", "2.21", "2.22"]
        TEST: ["sanity", "units"]
  script:
    - nox -R -s "${TEST}-${ANSIBLE_CORE}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

integration:
  stage: integration
  extends: [.reports, .ansible-builder]
  needs: ["sanity"]
  parallel:
    matrix:
      - ANSIBLE_CORE: ["2.19", "2.20", "2.21", "2.22"]
        ANSIBLE_TEST_DOCKER: ["default"]
      - ANSIBLE_CORE: ["2.21"]
        ANSIBLE_TEST_DOCKER: ["ubuntu2404", "fedora43"]
  script:
    - nox -R -s "integration-${ANSIBLE_CORE}"
  rules:
    - exists:
        - tests/integration/targets/**/*

molecule:
  stage: integration
  extends: .ansible-builder
  needs: ["lint"]
  script:
    - nox -R -s molecule
  rules:
    - exists:
        - extensions/molecule/**/molecule.yml

# ---------------------------------------------------------------------------
# Publication (tags uniquement) vers Nexus ansible-hosted ou Automation Hub prive
# ---------------------------------------------------------------------------
publish:
  stage: publish
  needs: ["build", "lint", "security-scan", "sanity", "units"]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GALAXY_PUBLISH_SERVER: "nexus_hosted"
    # ANSIBLE_GALAXY_SERVER_NEXUS_HOSTED_TOKEN : variable CI/CD masquee + protegee (Settings > CI/CD)
  script:
    - test -n "${ANSIBLE_GALAXY_SERVER_NEXUS_HOSTED_TOKEN}"
    - nox -R -s publish
  environment:
    name: nexus-ansible-hosted
