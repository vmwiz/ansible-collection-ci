# ci/ansible.cfg - utilise UNIQUEMENT pour ansible-galaxy (passe via ANSIBLE_CONFIG par noxfile.py).
# Nexus Repository >= 3.93 : format "Ansible" (proxy de https://galaxy.ansible.com, hosted, group).
# Doc : https://help.sonatype.com/en/configure-ansible-with-nexus.html
#
# Secrets : NE PAS ecrire de jeton ici. ansible-galaxy lit
#   ANSIBLE_GALAXY_SERVER_<NOM>_TOKEN  (ex. ANSIBLE_GALAXY_SERVER_NEXUS_HOSTED_TOKEN)
# ou ANSIBLE_GALAXY_SERVER_<NOM>_USERNAME / _PASSWORD (auth basique).
# Jeton Nexus = base64("user:password") + realm "Ansible Galaxy Bearer Token Realm" actif.

[galaxy]
# Ordre de resolution des dependances : le group (proxy galaxy.ansible.com + hosted interne)
server_list = nexus_group, nexus_hosted

[galaxy_server.nexus_group]
url = https://nexus.corp.local/repository/ansible-group/

[galaxy_server.nexus_hosted]
# Cible de `ansible-galaxy collection publish --server nexus_hosted`
url = https://nexus.corp.local/repository/ansible-hosted/

# Alternative : Private Automation Hub (galaxy_ng) on-prem
# [galaxy_server.pah]
# url = https://pah.corp.local/api/galaxy/content/published/
# token = (via ANSIBLE_GALAXY_SERVER_PAH_TOKEN)
