# galaxy-importer configuration (read through GALAXY_IMPORTER_CONFIG by `aci importer`)
# Defaults: https://github.com/ansible/galaxy-importer/blob/master/galaxy_importer/config.py
[galaxy-importer]
# ansible-test already runs in the sanity stages; no need to run it again here
RUN_ANSIBLE_TEST = False
# ansible-lint run by the import, offline (default True, made explicit here)
RUN_ANSIBLE_LINT = True
OFFLINE_ANSIBLE_LINT = True
RUN_ANSIBLE_DOC = True
CHECK_CHANGELOG = True
# Like ansible/ansible-content-actions build_import.yaml: require galaxy.yml tags
CHECK_REQUIRED_TAGS = True
