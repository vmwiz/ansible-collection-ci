# Configuration galaxy-importer (lue via GALAXY_IMPORTER_CONFIG par noxfile.py)
# Valeurs par defaut : https://github.com/ansible/galaxy-importer/blob/master/galaxy_importer/config.py
[galaxy-importer]
# ansible-test est deja execute dans les jobs sanity-* ; inutile de le relancer ici
RUN_ANSIBLE_TEST = False
# ansible-lint integre a l'import, en mode hors-ligne (defaut True, explicite ici)
RUN_ANSIBLE_LINT = True
OFFLINE_ANSIBLE_LINT = True
RUN_ANSIBLE_DOC = True
CHECK_CHANGELOG = True
# Comme ansible/ansible-content-actions build_import.yaml : exiger les tags galaxy.yml
CHECK_REQUIRED_TAGS = True
