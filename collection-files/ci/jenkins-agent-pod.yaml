# Pod d'agent Jenkins (plugin Kubernetes) compatible OpenShift SCC "restricted-v2" :
#   - aucun runAsUser fixe : OpenShift attribue un UID aleatoire de la plage du namespace (GID 0) ;
#   - non-root, pas d'escalade de privileges, capabilities supprimees, seccomp RuntimeDefault ;
#   - AUCUN moteur de conteneurs (ni socket, ni DinD, ni privileged).
# Etapes executees ici : lint, docs, build, galaxy-importer, security-scan, spotter,
# sanity/units en ANSIBLE_TEST_MODE=venv. Le reste va sur l'agent VM "ansible-builder".
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: ansible-collection-ci
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: jnlp
      # Image agent Jenkins tiree via le proxy Docker Hub du Nexus (doit faire confiance a l'AC interne
      # si le controleur Jenkins est en HTTPS : voir le README du plugin Kubernetes).
      image: nexus.corp.local:8443/jenkins/inbound-agent:latest-jdk21
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 512Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    - name: runner
      image: nexus.corp.local:8443/ci/ansible-collection-runner:2026.10
      imagePullPolicy: IfNotPresent
      command: ["sleep"]
      args: ["infinity"]
      env:
        - name: HOME
          value: /home/ci
        - name: ANSIBLE_TEST_MODE
          value: venv
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "4", memory: 6Gi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
