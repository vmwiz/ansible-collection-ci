---
# Configuration Molecule "ansible-native" (Molecule >= 25.9) partagee par tous les scenarios.
# Pas de driver : le scenario "default" cree/detruit les conteneurs avec containers.podman.
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../inventory.yml

scenario:
  test_sequence:
    - converge
    - idempotence
    - verify

shared_state: true
