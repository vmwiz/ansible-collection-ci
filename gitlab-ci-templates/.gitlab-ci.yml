# Pipeline of the COMPONENT PROJECT (ci/ansible-collection-ci): validates the template, tries it on the
# example collection, publishes the release in the CI/CD catalog on tags (x.y.z).
stages: [validate, test, release]

validate:
  stage: validate
  image: nexus.corp.local:8443/ci/ansible-collection-runner:2026.10   # PyYAML + check-jsonschema (see README)
  tags: [ansible-runner]
  variables:
    GITLAB_CI_SCHEMA: tests/gitlab-ci-schema.json   # copy of the official schema, updated with GitLab
  script:
    - /opt/ansible-ci/bin/python -m pip install -q check-jsonschema
    - PATH=/opt/ansible-ci/bin:$PATH tests/validate.sh "$GITLAB_CI_SCHEMA"

# Real run of the component at the commit version, on the example collection (copy in tests/collection)
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/ansible-collection@$CI_COMMIT_SHA
    inputs:
      stage-static: test
      stage-test: test
      publish: false

variables:   # the test collection is in a subdirectory; reports and tarball stay at the root
  ACI_SRC: $CI_PROJECT_DIR/tests/collection
  ACI_REPORTS: $CI_PROJECT_DIR/reports
  ACI_DIST: $CI_PROJECT_DIR/dist

release:
  stage: release
  image: nexus.corp.local:8443/gitlab-org/cli:latest   # PLACEHOLDER: Nexus mirror of the glab image
  tags: [ansible-runner]
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script: echo "Publishing $CI_COMMIT_TAG to the CI/CD catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "See CHANGELOG.md"
