# GitLab CI/CD component "ansible-collection" - ansible-ci 1.1.0
# Test/validation pipeline for an Ansible collection (airgapped, Nexus, AAP 2.6), running the same `aci`
# scripts (installed in the runner image under /opt/ansible-ci) as the Jenkins shared library.
# GitLab >= 17.0 (components and inputs GA). Usage: see README.md / USER-GUIDE.md.
#   include:
#     - component: $CI_SERVER_FQDN/ci/ansible-collection-ci/ansible-collection@1
# Secrets (masked CI/CD variables, never inputs): ACI_GALAXY_TOKEN (publication, protected variable),
# SPOTTER_TOKEN (private Spotter).
spec:
  inputs:
    # ---- GitLab stages (GitLab default stages: build, test, deploy) ----
    stage-static:
      default: build
      description: Stage of the static checks (lint, docs, build, certification, security...).
    stage-test:
      default: test
      description: Stage of ansible-test (sanity, units, integration) and molecule.
    stage-publish:
      default: deploy
      description: Publication stage (on tags).
    # ---- images and runners ----
    runner-image:
      default: nexus.corp.local:8443/ci/ansible-collection-runner:2026.10
      description: Runner image (contains /opt/ansible-ci/bin/aci and Python 3.12). Its tag pins the scripts.
    runner-tags:
      type: array
      default: [ansible-runner]
      description: Tags of the Kubernetes/OpenShift runner (restricted-v2 pods, no container engine).
    builder-tags:
      type: array
      default: [ansible-builder]
      description: Tags of the shell runner on the ansible-builder VM (podman) - docker mode, integration, molecule, EE.
    aci-path:
      default: /opt/ansible-ci/bin/aci
      description: Path of the aci scripts in the runner image and on the ansible-builder VM.
    # ---- ansible-core matrix (AAP 2.6 = 2.16 + 2.18, EE Python 3.12) ----
    ansible-core-versions:
      type: array
      default: ['2.16', '2.18']
      description: Tested series, quoted. With target-ees, must list exactly the series of the EEs.
    ansible-core-optional:
      default: ''
      regex: ^[0-9. a-z]*$
      description: Extra non-blocking series, space separated (e.g. "2.20" for AAP 2.7).
    ansible-core-prerelease:
      default: ''
      regex: ^[0-9. a-z]*$
      description: Series of ansible-core-versions that are pre-releases (rc), non-blocking failure (code 3).
    ansible-core-default:
      default: ''
      regex: ^([0-9]+\.[0-9]+)?$
      description: Series of the non-matrix jobs (default - last series that is not a pre-release).
    target-ees:
      default: ''
      description: Target EE images, space separated; introspection (fail early) and exact version per series.
    # ---- jobs ----
    lint: {type: boolean, default: true, description: 'yamllint + ansible-lint + antsibull-changelog lint'}
    docs: {type: boolean, default: true, description: 'antsibull-docs lint-collection-docs'}
    build: {type: boolean, default: true, description: 'ansible-galaxy collection build'}
    galaxy-importer: {type: boolean, default: true, description: 'galaxy-importer on the tarball (needs build)'}
    security-scan: {type: boolean, default: true, description: 'ansible-security-scanner'}
    certification: {type: boolean, default: true, description: 'Red Hat certification checks (partner-certification-checker 6.0.0)'}
    certification-sanity: {type: boolean, default: true, description: 'py3.12 sanity on stable-2.16/2.18/2.20 not covered by the matrix'}
    changelog-check: {type: boolean, default: true, description: 'Changelog fragment required on MRs'}
    changelog-skip-token: {default: skip-changelog, description: 'MR label or title word that exempts from the fragment'}
    sanity: {type: boolean, default: true}
    units: {type: boolean, default: true}
    integration: {type: boolean, default: false, description: 'ansible-test integration --docker (ansible-builder VM)'}
    molecule: {type: boolean, default: false, description: 'molecule test (ansible-builder VM)'}
    spotter: {type: boolean, default: false, description: 'Steampunk Spotter (private instance, spotter-endpoint required)'}
    ee-tests: {type: boolean, default: false, description: 'Untested POC - units inside the target-ees EEs'}
    publish: {type: boolean, default: true, description: 'Publication to Nexus on tags (ACI_GALAXY_TOKEN)'}
    # ---- ansible-test ----
    test-mode:
      default: auto
      options: [auto, venv, docker]
      description: auto = docker on tags, schedules and the default branch; venv otherwise.
    sanity-args: {default: '', description: 'Extra ansible-test sanity arguments'}
    units-args: {default: '', description: 'Extra ansible-test units arguments'}
    integration-args: {default: '', description: 'Extra ansible-test integration arguments'}
    integration-images:
      type: array
      default: [default]
      description: ansible-test --docker images for integration (one job per image).
    docker-network: {default: '', description: 'ansible-test --docker-network'}
    coverage: {type: boolean, default: false}
    molecule-images: {default: 'ubuntu2404 fedora40', description: 'Molecule images, space separated'}
    # ---- Nexus / Galaxy ----
    pip-index-url: {default: '', description: 'Empty = /etc/pip.conf of the image (the only one read by ansible-test --venv)'}
    pypi-endpoint: {default: 'https://nexus.corp.local/repository/pypi-group/simple', description: 'PyPI index of the ansible-test containers'}
    image-mirror: {default: 'nexus.corp.local:8444', description: 'Mirror of the quay.io/ansible images'}
    galaxy-server-url: {default: 'https://nexus.corp.local/repository/ansible-group/'}
    galaxy-publish-url: {default: 'https://nexus.corp.local/repository/ansible-hosted/'}
    # ---- scanners ----
    security-fail-on: {default: high, options: [high, critical, none]}
    spotter-endpoint: {default: '', description: 'API URL of the private Spotter instance'}
    spotter-allow-failure: {type: boolean, default: true}
    spotter-ansible-version: {default: '2.20'}
    spotter-display-level: {default: error, options: [hint, warning, error]}
---
.aci-base:
  image: $[[ inputs.runner-image ]]
  tags: $[[ inputs.runner-tags ]]
  interruptible: true
  variables:
    ACI: $[[ inputs.aci-path ]]
    ACI_EXPECTED_VERSION: "1.1.0"
    # "series" prefix: an input on its own would be interpolated as an ARRAY (refused in variables)
    ACI_CORE_VERSIONS: "series $[[ inputs.ansible-core-versions ]]"   # without the optional ones (default series)
    ACI_PRERELEASE: "$[[ inputs.ansible-core-prerelease ]]"
    ACI_CORE_DEFAULT: "$[[ inputs.ansible-core-default ]]"
    ACI_PRERELEASE_EXIT_CODE: "3"
    ACI_PIP_INDEX_URL: "$[[ inputs.pip-index-url ]]"
    ACI_PYPI_ENDPOINT: "$[[ inputs.pypi-endpoint ]]"
    ACI_IMAGE_MIRROR: "$[[ inputs.image-mirror ]]"
    ACI_GALAXY_URL: "$[[ inputs.galaxy-server-url ]]"
    ACI_GALAXY_PUBLISH_URL: "$[[ inputs.galaxy-publish-url ]]"
    ACI_SANITY_ARGS: "$[[ inputs.sanity-args ]]"
    ACI_UNITS_ARGS: "$[[ inputs.units-args ]]"
    ACI_INTEGRATION_ARGS: "$[[ inputs.integration-args ]]"
    ACI_DOCKER_NETWORK: "$[[ inputs.docker-network ]]"
    ACI_COVERAGE: "$[[ inputs.coverage ]]"
    ACI_EE_MATRIX: reports/ee/matrix.txt
  # No GitLab `cache:`: it requires a path INSIDE the project, which lint/sanity would then scan (seen
  # on the bench). Venvs go to ~/.cache/ansible-ci; to keep them between jobs, mount a persistent
  # volume there in the Kubernetes runner configuration (see README.md).
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [reports/]
    exclude: [reports/**/.tmp/**]

.aci-builder:
  extends: .aci-base
  tags: $[[ inputs.builder-tags ]]   # persistent VM: ~/.cache/ansible-ci stays there between jobs

# Test jobs wait for the EE introspection when it exists (otherwise they start right away).
.aci-needs-ee:
  needs:
    - job: aci-ee-introspect
      optional: true

# ---------------------------------------------------------------------------------------------- .pre
aci-ee-introspect:
  extends: .aci-builder
  stage: .pre
  variables:
    ACI_EE_EXPECT_CORES: "series $[[ inputs.ansible-core-versions ]]"
  script:
    - $ACI ee-introspect $[[ inputs.target-ees ]]
  artifacts:
    paths: [reports/ee/]
  rules:
    - if: '"$[[ inputs.target-ees ]]" != ""'

# ------------------------------------------------------------------------------------ static checks
aci-changelog:
  extends: .aci-base
  stage: $[[ inputs.stage-static ]]
  needs: []
  variables:
    GIT_DEPTH: "0"
    ACI_CHANGELOG_SKIP: $[[ inputs.changelog-skip-token ]]
  script:
    - $ACI changelog-check
  rules:
    - if: '"$[[ inputs.changelog-check ]]" == "true" && $CI_MERGE_REQUEST_IID'

aci-certification:
  extends: .aci-base
  stage: $[[ inputs.stage-static ]]
  needs: []
  script:
    - $ACI certification
    - $ACI certification sanity-cores > reports/certification/sanity-cores.txt
  rules:
    - if: '"$[[ inputs.certification ]]" == "true"'

aci-lint:
  extends: .aci-base
  stage: $[[ inputs.stage-static ]]
  needs: []
  script:
    - $ACI lint
  rules:
    - if: '"$[[ inputs.lint ]]" == "true"'

aci-docs:
  extends: .aci-base
  stage: $[[ inputs.stage-static ]]
  needs: []
  script:
    - $ACI docs
  rules:
    - if: '"$[[ inputs.docs ]]" == "true"'

aci-build:
  extends: .aci-base
  stage: $[[ inputs.stage-static ]]
  needs: []
  script:
    - $ACI build
    - if [ "$[[ inputs.galaxy-importer ]]" = true ]; then $ACI importer; fi
  artifacts:
    paths: [dist/, reports/]
  rules:
    - if: '"$[[ inputs.build ]]" == "true"'

aci-security:
  extends: .aci-base
  stage: $[[ inputs.stage-static ]]
  needs: []
  variables:
    ACI_SECURITY_FAIL_ON: $[[ inputs.security-fail-on ]]
  script:
    - $ACI security-scan
  artifacts:
    reports:
      junit: reports/security/*.xml
  rules:
    - if: '"$[[ inputs.security-scan ]]" == "true"'

aci-spotter:
  extends: .aci-base
  stage: $[[ inputs.stage-static ]]
  needs: []
  allow_failure: $[[ inputs.spotter-allow-failure ]]
  variables:
    SPOTTER_ENDPOINT: $[[ inputs.spotter-endpoint ]]
    ACI_SPOTTER_ANSIBLE_VERSION: "$[[ inputs.spotter-ansible-version ]]"
    ACI_SPOTTER_DISPLAY_LEVEL: $[[ inputs.spotter-display-level ]]
  script:
    - $ACI spotter
  artifacts:
    reports:
      junit: reports/spotter/spotter.xml
  rules:
    - if: '"$[[ inputs.spotter ]]" == "true"'

# --------------------------------------------------------------------------------------- ansible-test
# venv (pod) by default; docker (ansible-builder VM, ansible-test containers) when test-mode=docker,
# or in auto mode on tags, scheduled pipelines and the default branch.
.aci-rules-venv:
  rules:
    - if: '"$[[ inputs.test-mode ]]" == "venv"'
    - if: '"$[[ inputs.test-mode ]]" == "docker"'
      when: never
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: on_success

.aci-rules-docker:
  rules:
    - if: '"$[[ inputs.test-mode ]]" == "docker"'
    - if: '"$[[ inputs.test-mode ]]" == "venv"'
      when: never
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.aci-sanity:
  extends: .aci-needs-ee
  stage: $[[ inputs.stage-test ]]
  parallel:
    matrix:
      - ACI_CORE: $[[ inputs.ansible-core-versions ]]
  allow_failure:
    exit_codes: [3]          # pre-release series (ansible-core-prerelease)
  script:
    - $ACI sanity
  artifacts:
    reports:
      junit: reports/sanity-*/junit/*.xml

.aci-units:
  extends: .aci-needs-ee
  stage: $[[ inputs.stage-test ]]
  parallel:
    matrix:
      - ACI_CORE: $[[ inputs.ansible-core-versions ]]
  allow_failure:
    exit_codes: [3]
  script:
    - $ACI units
  artifacts:
    reports:
      junit: reports/units-*/junit/*.xml

aci-sanity-venv:
  extends: [.aci-base, .aci-sanity]
  variables: {ACI_TEST_MODE: venv}
  rules:
    - if: '"$[[ inputs.sanity ]]" != "true"'
      when: never
    - !reference [.aci-rules-venv, rules]

aci-sanity-docker:
  extends: [.aci-builder, .aci-sanity]
  variables: {ACI_TEST_MODE: docker}
  rules:
    - if: '"$[[ inputs.sanity ]]" != "true"'
      when: never
    - !reference [.aci-rules-docker, rules]

aci-units-venv:
  extends: [.aci-base, .aci-units]
  variables: {ACI_TEST_MODE: venv}
  rules:
    - if: '"$[[ inputs.units ]]" != "true"'
      when: never
    - !reference [.aci-rules-venv, rules]

aci-units-docker:
  extends: [.aci-builder, .aci-units]
  variables: {ACI_TEST_MODE: docker}
  rules:
    - if: '"$[[ inputs.units ]]" != "true"'
      when: never
    - !reference [.aci-rules-docker, rules]

# Optional series (e.g. 2.20 = AAP 2.7): non-blocking, in venv mode.
aci-optional-cores:
  extends: .aci-base
  stage: $[[ inputs.stage-test ]]
  needs: []
  allow_failure: true
  variables: {ACI_TEST_MODE: venv}
  script:
    - |
      rc=0
      for core in $[[ inputs.ansible-core-optional ]]; do
        if [ "$[[ inputs.sanity ]]" = true ]; then ACI_CORE=$core $ACI sanity || rc=1; fi
        if [ "$[[ inputs.units ]]" = true ]; then ACI_CORE=$core $ACI units || rc=1; fi
      done
      exit $rc
  artifacts:
    reports:
      junit: reports/*-*/junit/*.xml
  rules:
    - if: '"$[[ inputs.ansible-core-optional ]]" != ""'

# Certification sanity (Python 3.12, stable-2.16/2.18/2.20 filtered by requires_ansible) on the
# series that the matrix does not already cover with Python 3.12.
aci-certification-sanity:
  extends: .aci-base
  stage: $[[ inputs.stage-test ]]
  needs: []
  variables: {ACI_TEST_MODE: venv, ACI_PYTHON: "3.12"}
  script:
    - |
      # already covered = matrix series whose selected controller Python is 3.12
      covered=" "
      for core in $(echo '$[[ inputs.ansible-core-versions ]]' | grep -oE '[0-9]+\.[0-9]+|devel|milestone'); do
        py=$(env -u ACI_PYTHON ACI_CORE="$core" $ACI info 2>/dev/null | awk '$1 == "python" {print $2}')
        if [ "$py" = python3.12 ]; then covered="$covered$core "; fi
      done
      todo=""
      for core in $($ACI certification sanity-cores); do
        case "$covered" in *" $core "*) ;; *) todo="$todo $core" ;; esac
      done
      echo "certification sanity to run:${todo:- none (already covered by the matrix)}"
      for core in $todo; do ACI_CORE=$core $ACI sanity; done
  artifacts:
    reports:
      junit: reports/sanity-*/junit/*.xml
  rules:
    - if: '"$[[ inputs.certification ]]" == "true" && "$[[ inputs.certification-sanity ]]" == "true" && "$[[ inputs.sanity ]]" == "true"'

aci-integration:
  extends: .aci-builder
  stage: $[[ inputs.stage-test ]]
  needs: [{job: aci-ee-introspect, optional: true}]
  variables: {ACI_TEST_MODE: docker}
  parallel:
    matrix:
      - ACI_INTEGRATION_IMAGE: $[[ inputs.integration-images ]]
  script:
    - $ACI integration
  artifacts:
    reports:
      junit: reports/integration-*/junit/*.xml
  rules:
    - if: '"$[[ inputs.integration ]]" == "true"'

aci-molecule:
  extends: .aci-builder
  stage: $[[ inputs.stage-test ]]
  needs: []
  variables:
    ACI_MOLECULE_IMAGES: $[[ inputs.molecule-images ]]
  script:
    - $ACI prime-images
    - $ACI molecule
  rules:
    - if: '"$[[ inputs.molecule ]]" == "true"'

# UNTESTED POC (no access to registry.redhat.io on the bench): units inside each target EE.
aci-ee-units:
  extends: .aci-builder
  stage: $[[ inputs.stage-test ]]
  needs: [aci-ee-introspect]
  allow_failure: true
  script:
    - for image in $[[ inputs.target-ees ]]; do $ACI ee-units "$image"; done
  artifacts:
    reports:
      junit: reports/ee-units-*/junit/*.xml
  rules:
    - if: '"$[[ inputs.ee-tests ]]" == "true" && "$[[ inputs.target-ees ]]" != ""'

# ---------------------------------------------------------------------------------------- publish
aci-publish:
  extends: .aci-base
  stage: $[[ inputs.stage-publish ]]
  dependencies: [aci-build]   # no needs: waits for ALL previous stages to succeed
  script:
    - $ACI publish
  artifacts:
    paths: [dist/]
  rules:
    - if: '"$[[ inputs.publish ]]" == "true" && "$[[ inputs.build ]]" == "true" && $CI_COMMIT_TAG'
