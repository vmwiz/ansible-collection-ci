---
# Cibles de test : conteneurs podman (rootless) bases sur les images ansible-test,
# deja presentes localement apres `aci prime-images` (fait par `aci molecule` : alias ubuntu2404 fedora40,
# resolus pour la serie par defaut, ansible-core 2.18). Changer de serie = mettre a jour ces tags
# (ansible_test/_data/completion/docker.txt).
all:
  children:
    molecule:
      hosts:
        molecule-ubuntu2404:
          molecule_image: quay.io/ansible/ubuntu2404-test-container:8.1.0
        molecule-fedora40:
          molecule_image: quay.io/ansible/fedora40-test-container:8.1.0
      vars:
        ansible_connection: containers.podman.podman
        ansible_python_interpreter: auto_silent
