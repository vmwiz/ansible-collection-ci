---
- name: Verify
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Read /etc/motd
      ansible.builtin.slurp:
        src: /etc/motd
      register: motd

    - name: Check the content
      ansible.builtin.assert:
        that:
          - (motd.content | b64decode) == "Test Molecule\n"

    - name: Gather the service state (systemd is PID 1 in the target)
      ansible.builtin.service_facts:

    - name: Check that journald is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['systemd-journald.service'].state == 'running'
