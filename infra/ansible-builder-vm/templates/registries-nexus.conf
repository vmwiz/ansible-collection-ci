# /etc/containers/registries.conf.d/50-nexus-mirrors.conf (agents using Podman)
# With Podman, mirrors work for ANY registry (unlike Docker Engine, whose "registry-mirrors" only
# applies to docker.io). ansible-test can then pull quay.io/ansible/* without re-tagging: export
# ANSIBLE_TEST_PREFER_PODMAN=1 and leave ACI_IMAGE_MIRROR empty.

[[registry]]
prefix = "quay.io"
location = "quay.io"
blocked = false
[[registry.mirror]]
location = "nexus.corp.local:8444"

[[registry]]
prefix = "docker.io"
location = "docker.io"
[[registry.mirror]]
location = "nexus.corp.local:8443"

[[registry]]
prefix = "ghcr.io"
location = "ghcr.io"
[[registry.mirror]]
location = "nexus.corp.local:8445"
