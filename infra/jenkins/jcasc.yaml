# Jenkins Configuration as Code for the `ansible-ci` shared library (Jenkins admins only).
# Everything site-specific lives here; the pipeline itself takes no parameters.
# Requires the plugins: configuration-as-code, pipeline-groovy-lib, git, kubernetes, credentials-binding,
# plain-credentials, junit, timestamper, ansicolor, pipeline-model-definition.
# ${VAR:-default} is resolved by JCasC from the controller environment (secrets: from a Kubernetes Secret).
jenkins:
  globalNodeProperties:
    - envVars:
        env:
          # Read directly by `aci` (see ci-scripts/README.md for the full list)
          - key: ACI_GALAXY_URL                 # Nexus Galaxy group (proxy of galaxy.ansible.com + Automation Hub)
            value: "${ACI_GALAXY_URL:-https://nexus.corp.local/repository/ansible-group/}"
          - key: ACI_GALAXY_PUBLISH_URL         # Nexus Galaxy hosted repository (tag builds publish here)
            value: "${ACI_GALAXY_PUBLISH_URL:-https://nexus.corp.local/repository/ansible-hosted/}"
          - key: ACI_PYPI_ENDPOINT              # PyPI index used inside ansible-test containers (VM, docker mode)
            value: "${ACI_PYPI_ENDPOINT:-https://nexus.corp.local/repository/pypi-group/simple}"
          - key: ACI_IMAGE_MIRROR               # Nexus Docker proxy of quay.io (ansible-test images)
            value: "${ACI_IMAGE_MIRROR:-nexus.corp.local:8444}"
          - key: SPOTTER_ENDPOINT               # private Spotter API, e.g. https://spotter.corp.local/api
            value: "${SPOTTER_ENDPOINT:-}"      # empty = the Spotter stage is skipped
          - key: SPOTTER_CACERT
            value: "/etc/pki/tls/certs/ca-bundle.crt"

  clouds:
    - kubernetes:
        name: openshift
        namespace: "${AGENT_NAMESPACE:-jenkins-agents}"
        jenkinsUrl: "${JENKINS_INTERNAL_URL:-http://jenkins.jenkins.svc:8080}"
        jenkinsTunnel: "${JENKINS_TUNNEL:-jenkins-agent.jenkins.svc:50000}"
        containerCapStr: "50"
        templates:
          # Pod used by every ansible-ci stage that needs no container engine. The pipeline selects it with
          # `kubernetes { inheritFrom 'ansible-runner'; defaultContainer 'runner' }`.
          # OpenShift SCC restricted-v2: no fixed runAsUser (random namespace UID, GID 0), non-root,
          # no privilege escalation, all capabilities dropped, seccomp RuntimeDefault.
          - name: ansible-runner
            label: ansible-runner
            nodeUsageMode: EXCLUSIVE
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  app.kubernetes.io/part-of: ansible-collection-ci
              spec:
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: jnlp
                    resources:
                      requests: {cpu: 100m, memory: 256Mi}
                      limits: {memory: 512Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                  - name: runner
                    # bump this tag to roll out a new runner image (and thus a new `aci`) to everyone
                    image: nexus.corp.local:8443/ci/ansible-collection-runner:2026.10
                    imagePullPolicy: IfNotPresent
                    command: ["sleep"]
                    args: ["infinity"]
                    env:
                      - {name: HOME, value: /home/ci}
                      - {name: TMPDIR, value: /tmp}
                      - {name: LANG, value: C.UTF-8}
                    resources:
                      requests: {cpu: "1", memory: 2Gi}
                      limits: {cpu: "4", memory: 6Gi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - {name: tmp, mountPath: /tmp}
                volumes:
                  - {name: tmp, emptyDir: {}}

  # The ansible-builder VMs (infra/ansible-builder-vm/) join as permanent agents labelled `ansible-builder`.
  # Declare them here or in the UI; one executor per parallel integration/Molecule run.

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: spotter-api-token             # private Spotter instance API token
              secret: "${SPOTTER_API_TOKEN}"
          - string:
              scope: GLOBAL
              id: nexus-galaxy-hosted-token     # token allowed to publish to ACI_GALAXY_PUBLISH_URL
              secret: "${NEXUS_GALAXY_TOKEN}"

unclassified:
  globalLibraries:
    libraries:
      - name: ansible-ci
        defaultVersion: v2                  # moving tag v2 = latest 2.x release
        allowVersionOverride: true          # lets a team pin @Library('ansible-ci@v2.0.0')
        implicit: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "${ACI_LIBRARY_REMOTE:-https://gitlab.corp.local/ci/ansible-ci-jenkins.git}"
                credentialsId: gitlab-read-ansible-ci
                traits:
                  - gitBranchDiscovery
                  - gitTagDiscovery
