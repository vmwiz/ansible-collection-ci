# POC UNIQUEMENT (non valide sur cluster) : podman DANS un pod, OpenShift >= 4.20
# (user namespaces GA + SCC "nested-container"). Necessite :
#   oc adm policy add-scc-to-user nested-container -z <serviceaccount-jenkins-agents> -n ci-ansible
# Point bloquant probable pour ansible-test : il lance un conteneur utilitaire en
# "--privileged --pid host" et des conteneurs systemd ; a verifier dans ce contexte imbrique.
apiVersion: v1
kind: Pod
metadata:
  annotations:
    # /dev/fuse pour fuse-overlayfs dans le conteneur (cf. article Red Hat Dev Spaces)
    io.kubernetes.cri-o.Devices: /dev/fuse,/dev/net/tun
spec:
  hostUsers: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: jnlp
      image: nexus.corp.local:8443/jenkins/inbound-agent:latest-jdk21
    - name: runner
      image: nexus.corp.local:8443/ci/ansible-collection-runner-podman:2026.10  # variante avec podman
      command: ["sleep"]
      args: ["infinity"]
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        procMount: Unmasked
        capabilities:
          add: ["SETUID", "SETGID"]
