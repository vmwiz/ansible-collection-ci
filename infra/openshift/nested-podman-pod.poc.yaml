# POC ONLY (not validated on a cluster): podman INSIDE a pod, OpenShift >= 4.20
# (user namespaces GA + SCC "nested-container"). Requires:
#   oc adm policy add-scc-to-user nested-container -z <jenkins-agents-serviceaccount> -n ci-ansible
# Likely blocker for ansible-test: it starts a utility container with "--privileged --pid host"
# and systemd containers; to be checked in this nested context.
apiVersion: v1
kind: Pod
metadata:
  annotations:
    # /dev/fuse for fuse-overlayfs inside the container (see the Red Hat Dev Spaces article)
    io.kubernetes.cri-o.Devices: /dev/fuse,/dev/net/tun
spec:
  hostUsers: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: jnlp
      image: nexus.corp.local:8443/jenkins/inbound-agent:latest-jdk21
    - name: runner
      image: nexus.corp.local:8443/ci/ansible-collection-runner-podman:2026.10  # variant with podman
      command: ["sleep"]
      args: ["infinity"]
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        procMount: Unmasked
        capabilities:
          add: ["SETUID", "SETGID"]
