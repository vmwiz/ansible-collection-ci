# /etc/containers/registries.conf.d/50-nexus-mirrors.conf (agents utilisant Podman)
# Avec Podman, les miroirs fonctionnent pour N'IMPORTE QUEL registre (contrairement a Docker
# Engine dont "registry-mirrors" ne s'applique qu'a docker.io). ansible-test peut alors tirer
# quay.io/ansible/* sans re-tag : exporter ANSIBLE_TEST_PREFER_PODMAN=1 et laisser
# ANSIBLE_TEST_IMAGE_MIRROR vide.

[[registry]]
prefix = "quay.io"
location = "quay.io"
blocked = false
[[registry.mirror]]
location = "nexus.corp.local:8444"

[[registry]]
prefix = "docker.io"
location = "docker.io"
[[registry.mirror]]
location = "nexus.corp.local:8443"

[[registry]]
prefix = "ghcr.io"
location = "ghcr.io"
[[registry.mirror]]
location = "nexus.corp.local:8445"
