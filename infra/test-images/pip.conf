# /etc/pip.conf - image ansible-test derivee (airgap)
# Nexus "pypi-group" = pypi-proxy (https://pypi.org) + pypi-hosted (paquets internes)
[global]
index-url = https://nexus.corp.local/repository/pypi-group/simple
cert = /etc/ssl/certs/ca-certificates.crt
timeout = 60
retries = 5
disable-pip-version-check = true
